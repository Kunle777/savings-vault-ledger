services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: localdemo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:localdemo@db:5432/ledger
      JWT_SECRET: local-only-change-me
      PAYSTACK_MODE: mock
      PAYSTACK_SECRET_KEY: mock-secret
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

