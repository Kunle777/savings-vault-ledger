[project]
name = "savings-vault-ledger"
version = "0.1.0"
description = "Standalone savings vault and fintech ledger service demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "PyJWT>=2.9", "httpx>=0.27", "alembic>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["E401", "E701", "E702"]
